name: Verify foreground GPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/gps-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --grep 'HTTPS geolocation'
        env:
          BASE_URL: https://azfiles.github.io/TrailQuest-web/
